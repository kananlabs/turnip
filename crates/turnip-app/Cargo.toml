[package]
name = "turnip-app"
description = "Terminal-native coding agent (turnip TUI application)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "turnip"
path = "src/main.rs"

[dependencies]
turnip-core = { path = "../turnip-core" }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
unicode-width = "0.2"
uuid = "1.29.0"
